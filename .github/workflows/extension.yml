# Claude Desktop extension: a v* tag publishes doctolib-cli.mcpb on its GitHub release.
name: extension

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  extension:
    permissions:
      contents: write
    uses: ClementWalter/mcp-bridge/.github/workflows/extension.yml@1ec926fd4034b8ab1886a315c608cf2d2e55927a
    with:
      launcher: bin/doctolib
      bridge-ref: 1ec926fd4034b8ab1886a315c608cf2d2e55927a
